<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - ศักรินทร์ เอมอาจ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* พื้นหลังแบบไล่ระดับสีดูทันสมัย */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transition: transform 0.3s ease;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .profile-card:hover {
            transform: translateY(-10px);
        }

        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 20px;
            overflow: hidden;
            border: 5px solid #fff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 { margin: 0; color: #2d3436; font-size: 1.6rem; }
        .nickname { color: #6c5ce7; font-weight: 600; margin-bottom: 5px; }
        .subtitle { color: #636e72; font-size: 0.9rem; margin-bottom: 25px; }

        .info-container {
            text-align: left;
            background: #fdfdfd;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid #eee;
        }

        .info-row {
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #f0f0f0;
        }

        .label { font-size: 0.75rem; color: #b2bec3; text-transform: uppercase; letter-spacing: 1px; }
        .value { font-size: 1rem; color: #2d3436; font-weight: 500; }
        
        .contact { color: #6c5ce7; text-decoration: none; font-weight: 500; }
        .contact:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="profile-card">
    <div class="profile-pic">
        <img src="4395.jpg" alt="รูปโปรไฟล์">
    </div>
    
    <h1>ศักรินทร์ เอมอาจ</h1>
    <div class="nickname">(อิง)</div>
    <div class="subtitle">มหาวิทยาลัยราชภัฏหมู่บ้านจอมบึง</div>
    
    <div class="info-container">
        <div class="info-row">
            <div class="label">รหัสนักศึกษา</div>
            <div class="value">694245012</div>
        </div>
        <div class="info-row">
            <div class="label">สาขาวิชา</div>
            <div class="value">วิทยาการคอมพิวเตอร์</div>
        </div>
        <div class="info-row">
            <div class="label">คณะ</div>
            <div class="value">วิทยาศาสตร์และเทคโนโลยี</div>
        </div>
        <div class="info-row">
            <div class="label">เบอร์โทรศัพท์</div>
            <div class="value"><a href="tel:0615694943" class="contact">0615694943</a></div>
        </div>
        <div class="info-row">
            <div class="label">อีเมล</div>
            <div class="value"><a href="mailto:sakkarin0378@gmail.com" class="contact">sakkarin0378@gmail.com</a></div>
        </div>
    </div>
</div>

</body>
</html>
