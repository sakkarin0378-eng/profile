<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - ศักรินทร์ เอมอาจ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a; /* Dark Navy Background */
            background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
            overflow: hidden;
        }

        /* เพิ่มลูกเล่นเส้นสาย Tech พื้นหลัง */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/cubes.png');
            opacity: 0.1;
        }

        .profile-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 420px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            transition: all 0.4s ease;
        }

        .profile-card:hover {
            transform: scale(1.02);
            border-color: #38bdf8;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
        }

        .profile-pic {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 4px solid #38bdf8;
            padding: 3px;
            overflow: hidden;
            background: #334155;
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        h1 { font-size: 1.5rem; margin: 0; color: #f8fafc; }
        .nickname { color: #38bdf8; font-size: 1rem; margin-bottom: 5px; }
        .subtitle { font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px; }

        /* Skill Badges */
        .skills { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; }
        .badge { background: #334155; padding: 5px 15px; border-radius: 20px; font-size: 0.75rem; color: #38bdf8; border: 1px solid #475569; }

        .info-container {
            text-align: left;
            background: rgba(255,255,255,0.03);
            padding: 20px;
            border-radius: 20px;
        }

        .info-row { margin-bottom: 10px; }
        .label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; }
        .value { font-size: 0.95rem; color: #e2e8f0; margin-bottom: 5px; }
        
        .contact { color: #38bdf8; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>

<div class="profile-card">
    <div class="profile-pic">
        <img src="4395.jpg" alt="รูปโปรไฟล์">
    </div>
    
    <h1>ศักรินทร์ เอมอาจ</h1>
    <div class="nickname">(อิง)</div>
    <div class="subtitle">มหาวิทยาลัยราชภัฏหมู่บ้านจอมบึง</div>
<div 
    <div class="info-container">
        <div class="info-row">
            <div class="label">รหัสนักศึกษา</div>
            <div class="value">694245012</div>
        </div>
        <div class="info-row">
            <div class="label">สาขาวิชา</div>
            <div class="value">วิทยาการคอมพิวเตอร์</div>
        </div>
        <div class="info-row">
            <div class="label">เบอร์โทรศัพท์</div>
            <div class="value"><a href="tel:0615694943" class="contact">0615694943</a></div>
        </div>
        <div class="info-row">
            <div class="label">อีเมล</div>
            <div class="value"><a href="mailto:sakkarin0378@gmail.com" class="contact">sakkarin0378@gmail.com</a></div>
        </div>
    </div>
</div>
    

</body>
</html>
